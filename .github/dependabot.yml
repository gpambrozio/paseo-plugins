version: 2
updates:
  # One entry over every plugin folder — there is no workspace root, so each
  # has its own package.json and lockfile.
  #
  # Everything is collapsed into one group on purpose: @getpaseo/plugin
  # peer-depends on the exact @getpaseo/client it ships against, so a PR that
  # bumps one without the other fails ERESOLVE. Grouping keeps them moving
  # together, and a group over `directories` is one PR across every folder
  # ("bump the all-dependencies group across 5 directories").
  #
  # A group applies to version updates only unless it says otherwise, and
  # security updates do not wait for the schedule or count toward
  # open-pull-requests-limit — so without the second group every alert was its
  # own PR, one per package per folder. A plugin folder missing from the list
  # gets no grouping and no commit prefix at all, which is how herald's arrived
  # as `build(deps-dev)`.
  - package-ecosystem: npm
    directories:
      - /skills
      - /github-board
      - /launchd-jobs
      - /model-pricing
      - /firstmate
      - /herald
    schedule:
      interval: monthly
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    # The app supplies these to a running plugin, so a plugin's own copy is a
    # type-checking stand-in for whatever Paseo ships, not a dependency it can
    # move on its own. @getpaseo/plugin peer-depends on the exact react the
    # app bundles, so bumping react (and react-native, which drags react with
    # it) fails ERESOLVE outright; the others merely let the typechecker
    # describe APIs the host does not have. They move by hand, when Paseo's
    # `plugin init` scaffold moves.
    ignore:
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: "@types/react"
      - dependency-name: "@tanstack/react-query"
      - dependency-name: zod
    open-pull-requests-limit: 1
    commit-message:
      prefix: deps
